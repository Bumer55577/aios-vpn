name: 'AIOS VPN — Windows installer'

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  Build-Windows:
    runs-on: windows-latest
    timeout-minutes: 340

    env:
      QT_VERSION: 6.10.1

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v3
      with:
        version: ${{ env.QT_VERSION }}
        host: 'windows'
        target: 'desktop'
        arch: 'win64_msvc2022_64'
        modules: 'qtremoteobjects qt5compat qtshadertools qtimageformats'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'

    - name: 'Setup MSVC'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: 'x64'

    - name: 'Setup .NET SDK'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: 'Install WiX Toolset'
      shell: powershell
      run: |
        dotnet tool install --global wix --version 4.0.6
        wix extension add -g WixToolset.UI.wixext/4.0.6
        wix extension add -g WixToolset.Util.wixext/4.0.6
        $wixBinDir = Join-Path $env:USERPROFILE ".dotnet\tools"
        echo "WIX_BIN_DIR=$wixBinDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project + MSI installer'
      shell: cmd
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
      run: |
        set WIX_ROOT_PATH="${{ env.USERPROFILE }}\.dotnet\tools"
        deploy\build.bat --installer wix

    - name: 'Collect installer'
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item deploy/build/AIOSVPN_*_windows_x64.msi dist/ -Force
        Get-ChildItem dist

    - name: 'Upload installer artifact'
      uses: actions/upload-artifact@v4
      with:
        path: dist/*.msi
        retention-days: 7

    # AIOS: публикация MSI в публичный rolling-release 'aios-windows'.
    # Прямая ссылка без входа в GitHub:
    # https://github.com/Bumer55577/aios-vpn/releases/tag/aios-windows
    - name: 'Publish MSI to public release'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        TAG="aios-windows"
        gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "AIOS VPN — Windows installer (актуальная сборка)" \
            --notes "Автоматическая сборка ветки master. Скачивайте .msi из блока Assets ниже и устанавливайте на Windows 10/11 (x64)."
        gh release upload "$TAG" dist/*.msi --repo "$GITHUB_REPOSITORY" --clobber
        echo "MSI опубликован в release $TAG"
      shell: bash
